name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests & MCP package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Backend unit tests
        run: ./mvnw -B -pl backend test

      - name: Package MCP server
        run: ./mvnw -B -pl mcp-server -am package -DskipTests

  frontend:
    name: Frontend lint, test, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  images:
    name: Container images build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker buildx build --load -t chatbi-backend:ci -f backend/Dockerfile .

      - name: Build production frontend image
        run: docker buildx build --load -t chatbi-frontend:ci -f deploy/prod/frontend/Dockerfile .

      - name: Build TLS edge image
        run: docker buildx build --load -t chatbi-edge:ci deploy/prod/edge
