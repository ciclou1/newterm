server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: chatbi-server
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${CHATBI_DB_URL:jdbc:postgresql://localhost:5432/chatbi?stringtype=unspecified}
    username: ${CHATBI_DB_USER:chatbi}
    password: ${CHATBI_DB_PASSWORD:chatbi}
    driver-class-name: org.postgresql.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 12
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
        slf4j:
          enabled: true

  data:
    redis:
      host: ${CHATBI_REDIS_HOST:localhost}
      port: ${CHATBI_REDIS_PORT:6379}
      password: ${CHATBI_REDIS_PASSWORD:}
      timeout: 1500ms
      connect-timeout: 1500ms
      lettuce:
        shutdown-timeout: 200ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Never leak component details (AI gateway, DB latency) to anonymous probes.
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.chatbi: INFO
    com.alibaba.druid: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

chatbi:
  ai:
    enabled: ${CHATBI_AI_ENABLED:false}
    base-url: ${CHATBI_AI_BASE_URL:https://api.openai.com}
    # CHATBI_AI_API_KEY is the canonical name; OPENAI_API_KEY stays supported
    # so existing deployments keep working.
    api-key: ${CHATBI_AI_API_KEY:${OPENAI_API_KEY:}}
    model: ${CHATBI_AI_MODEL:gpt-4.1-mini}
    temperature: ${CHATBI_AI_TEMPERATURE:0.1}
    max-tokens: ${CHATBI_AI_MAX_TOKENS:1400}
    # Leave prices empty unless the gateway/model card publishes them. Zero
    # means "unknown": token counts are still recorded, cost stays 0.
    input-cost-per-million: ${CHATBI_AI_INPUT_COST_PER_MILLION:0}
    output-cost-per-million: ${CHATBI_AI_OUTPUT_COST_PER_MILLION:0}
    price-currency: ${CHATBI_AI_PRICE_CURRENCY:USD}
    timeout-seconds: ${CHATBI_AI_TIMEOUT_SECONDS:45}
    connect-timeout-seconds: ${CHATBI_AI_CONNECT_TIMEOUT_SECONDS:10}
    # Hard budget for one completion, covering every HTTP attempt, backoff and
    # the JSON-mode fallback. The read timeout above bounds a single attempt.
    total-timeout-seconds: ${CHATBI_AI_TOTAL_TIMEOUT_SECONDS:60}
    max-retries: ${CHATBI_AI_MAX_RETRIES:2}
    retry-backoff-ms: ${CHATBI_AI_RETRY_BACKOFF_MS:800}
    json-mode: ${CHATBI_AI_JSON_MODE:true}
    # After an explicit response_format rejection JSON mode is paused for this
    # long, then re-probed. It is never disabled permanently.
    json-mode-probe-ttl-seconds: ${CHATBI_AI_JSON_MODE_PROBE_TTL_SECONDS:600}
    max-prompt-chars: ${CHATBI_AI_MAX_PROMPT_CHARS:28000}
    max-schema-chars: ${CHATBI_AI_MAX_SCHEMA_CHARS:16000}
    max-history-chars: ${CHATBI_AI_MAX_HISTORY_CHARS:2000}
    max-history-turns: ${CHATBI_AI_MAX_HISTORY_TURNS:3}
    max-question-chars: ${CHATBI_AI_MAX_QUESTION_CHARS:2000}
    allow-demo-fallback: ${CHATBI_AI_ALLOW_DEMO_FALLBACK:false}
  metrics:
    # Bearer token accepted only on /actuator/prometheus. Empty disables it.
    scrape-token: ${CHATBI_METRICS_TOKEN:}
  query:
    url: ${CHATBI_QUERY_DB_URL:jdbc:postgresql://localhost:5432/chatbi?stringtype=unspecified}
    username: ${CHATBI_READONLY_DB_USER:chatbi_ro}
    password: ${CHATBI_READONLY_DB_PASSWORD:chatbi_ro}
    max-rows: ${CHATBI_QUERY_MAX_ROWS:500}
    timeout-seconds: ${CHATBI_QUERY_TIMEOUT_SECONDS:8}
    explain-timeout-seconds: ${CHATBI_QUERY_EXPLAIN_TIMEOUT_SECONDS:3}
    max-explain-cost: ${CHATBI_QUERY_MAX_EXPLAIN_COST:250000}
    max-repairs: ${CHATBI_QUERY_MAX_REPAIRS:2}
  security:
    allowed-origins: ${CHATBI_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:8088}
  auth:
    # HS256 signing key. The local default is for development only; docker and
    # prod profiles require CHATBI_JWT_SECRET and fail fast when it is absent.
    jwt-secret: ${CHATBI_JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    jwt-issuer: ${CHATBI_JWT_ISSUER:chatbi}
    access-token-ttl-seconds: ${CHATBI_JWT_TTL_SECONDS:3600}
    demo-header-enabled: ${CHATBI_DEMO_HEADER_ENABLED:false}
    service-token: ${CHATBI_MCP_SERVICE_TOKEN:}
    service-username: ${CHATBI_MCP_SERVICE_USER:mcp-service}
    bootstrap-admin-username: ${CHATBI_BOOTSTRAP_ADMIN_USERNAME:lisi}
    # Docker/prod fail fast when seeded demo credentials are still in place and
    # this is empty. Value is only used to replace a demo/unset password.
    bootstrap-admin-password: ${CHATBI_BOOTSTRAP_ADMIN_PASSWORD:}
  rate-limit:
    enabled: ${CHATBI_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${CHATBI_RATE_LIMIT_QPM:10}
    burst-capacity: ${CHATBI_RATE_LIMIT_BURST:0}
    login-requests-per-minute: ${CHATBI_LOGIN_RATE_LIMIT_QPM:20}
    trust-forwarded-headers: ${CHATBI_TRUST_FORWARDED_HEADERS:false}
    login-failure-threshold: ${CHATBI_LOGIN_FAILURE_THRESHOLD:5}
    login-failure-window-seconds: ${CHATBI_LOGIN_FAILURE_WINDOW_SECONDS:900}
    login-lock-seconds: ${CHATBI_LOGIN_LOCK_SECONDS:900}
  quota:
    daily-token-limit: ${CHATBI_DAILY_TOKEN_LIMIT:2000000}
    daily-cost-limit-usd: ${CHATBI_DAILY_COST_LIMIT_USD:5.00}
    reserve-tokens: ${CHATBI_QUOTA_RESERVE_TOKENS:4096}
    reserve-cost-usd: ${CHATBI_QUOTA_RESERVE_COST_USD:0.05}
  schema-link:
    max-tables: 6
    max-columns-per-table: 18
    max-metrics: 6
    max-examples: 4
    cache-ttl-seconds: 300
  embedding:
    # The verified deepseek gateway returned 503 model_not_found for
    # /v1/embeddings (text-embedding-3-*, bge-m3, deepseek-embedding), so the
    # only implemented provider is the deterministic hash model. Its vectors
    # are lexical feature hashes, NOT semantic embeddings. Switching provider
    # also requires a Flyway migration for semantic_embedding.embedding
    # (currently vector(512)) and a full reindex.
    provider: ${CHATBI_EMBEDDING_PROVIDER:hash}
    dimensions: ${CHATBI_EMBEDDING_DIMENSIONS:512}
    model: ${CHATBI_EMBEDDING_MODEL:}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/chatbi?stringtype=unspecified
  data:
    redis:
      host: redis

chatbi:
  query:
    url: jdbc:postgresql://postgres:5432/chatbi?stringtype=unspecified
  auth:
    jwt-secret: ${CHATBI_JWT_SECRET:}
    demo-header-enabled: false

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  # JSON lines for log shippers; requestId is injected by RequestIdFilter.
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.chatbi: INFO

chatbi:
  auth:
    # Production must supply a random secret of at least 32 bytes.
    jwt-secret: ${CHATBI_JWT_SECRET:}
    demo-header-enabled: false
