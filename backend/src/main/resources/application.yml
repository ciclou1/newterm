server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: chatbi-server
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${CHATBI_DB_URL:jdbc:postgresql://localhost:5432/chatbi?stringtype=unspecified}
    username: ${CHATBI_DB_USER:chatbi}
    password: ${CHATBI_DB_PASSWORD:chatbi}
    driver-class-name: org.postgresql.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 12
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
        slf4j:
          enabled: true

  data:
    redis:
      host: ${CHATBI_REDIS_HOST:localhost}
      port: ${CHATBI_REDIS_PORT:6379}
      timeout: 1500ms
      connect-timeout: 1500ms
      lettuce:
        shutdown-timeout: 200ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.chatbi: INFO
    com.alibaba.druid: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

chatbi:
  ai:
    enabled: ${CHATBI_AI_ENABLED:false}
    base-url: ${CHATBI_AI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${CHATBI_AI_MODEL:gpt-4.1-mini}
    temperature: 0.1
    max-tokens: 1400
    input-cost-per-million: ${CHATBI_AI_INPUT_COST_PER_MILLION:0.40}
    output-cost-per-million: ${CHATBI_AI_OUTPUT_COST_PER_MILLION:1.60}
    timeout-seconds: 45
    allow-demo-fallback: ${CHATBI_AI_ALLOW_DEMO_FALLBACK:false}
  query:
    url: ${CHATBI_QUERY_DB_URL:jdbc:postgresql://localhost:5432/chatbi?stringtype=unspecified}
    username: ${CHATBI_READONLY_DB_USER:chatbi_ro}
    password: ${CHATBI_READONLY_DB_PASSWORD:chatbi_ro}
    max-rows: ${CHATBI_QUERY_MAX_ROWS:500}
    timeout-seconds: ${CHATBI_QUERY_TIMEOUT_SECONDS:8}
    explain-timeout-seconds: ${CHATBI_QUERY_EXPLAIN_TIMEOUT_SECONDS:3}
    max-explain-cost: ${CHATBI_QUERY_MAX_EXPLAIN_COST:250000}
    max-repairs: ${CHATBI_QUERY_MAX_REPAIRS:2}
  security:
    allowed-origins: ${CHATBI_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:8088}
  auth:
    # HS256 signing key. The local default is for development only; docker and
    # prod profiles require CHATBI_JWT_SECRET and fail fast when it is absent.
    jwt-secret: ${CHATBI_JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    jwt-issuer: ${CHATBI_JWT_ISSUER:chatbi}
    access-token-ttl-seconds: ${CHATBI_JWT_TTL_SECONDS:3600}
    demo-header-enabled: ${CHATBI_DEMO_HEADER_ENABLED:false}
    service-token: ${CHATBI_MCP_SERVICE_TOKEN:}
    service-username: ${CHATBI_MCP_SERVICE_USER:mcp-service}
  rate-limit:
    enabled: ${CHATBI_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${CHATBI_RATE_LIMIT_QPM:10}
    burst-capacity: ${CHATBI_RATE_LIMIT_BURST:0}
    login-requests-per-minute: ${CHATBI_LOGIN_RATE_LIMIT_QPM:20}
  quota:
    daily-token-limit: ${CHATBI_DAILY_TOKEN_LIMIT:2000000}
    daily-cost-limit-usd: ${CHATBI_DAILY_COST_LIMIT_USD:5.00}
  schema-link:
    max-tables: 6
    max-columns-per-table: 18
    max-metrics: 6
    max-examples: 4
    cache-ttl-seconds: 300

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/chatbi?stringtype=unspecified
  data:
    redis:
      host: redis

chatbi:
  query:
    url: jdbc:postgresql://postgres:5432/chatbi?stringtype=unspecified
  auth:
    jwt-secret: ${CHATBI_JWT_SECRET:}
    demo-header-enabled: false

---
spring:
  config:
    activate:
      on-profile: prod

chatbi:
  auth:
    # Production must supply a random secret of at least 32 bytes.
    jwt-secret: ${CHATBI_JWT_SECRET:}
    demo-header-enabled: false
