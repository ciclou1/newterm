# TLS terminator. Only 8080 (HTTP redirect) and 8443 (TLS) are used
# internally; compose publishes host 80/443.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Never serve anything over plaintext.
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hardening headers. Kept on the server block so every location inherits
    # them (locations below add no add_header of their own).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Bodies are small JSON payloads (questions are capped at 2000 chars).
    client_max_body_size 1m;
    limit_conn perip 50;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    # LLM calls have a 60s hard budget in the backend; allow headroom for the
    # rest of the request without letting clients hold connections forever.
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the client cannot smuggle its own address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header Server;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Actuator and the AI diagnostics endpoint are internal only. Prometheus
    # scrapes the backend over the internal network, not through this proxy.
    location /actuator/ {
        return 404;
    }

    location /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/chat/ {
        limit_req zone=chat_query burst=10 nodelay;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://backend:8080;
    }

    location / {
        proxy_read_timeout 30s;
        proxy_pass http://frontend:8080;
    }
}
