# Non-root nginx main config. Container runs as UID 101 (nginx) and listens on
# unprivileged 8080/8443; Docker maps host 80/443.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_access escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_access;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # The container root filesystem is read-only; all temp state lives on the
    # tmpfs mounted at /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Proxy-layer protection against credential stuffing and query floods. The
    # backend has its own per-user limits; these bound anonymous traffic.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=chat_query:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
